<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLTA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #container {
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }       
        h1 {
            margin-bottom: 10px;
        }
        h2 {
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: 2px solid #0B4828;
            border-radius: 4px;
            background-color: #48A969;
            color: black;
            cursor: pointer;
        }
        button:hover {
            background-color: #368751;
        }

        #div_1 {
            background-color: white;
            width: 50%;
            height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
</style>
<script src="script.js" defer></script>
</head>
<body>
    <div id="container">
        <div id="div_1">
            <img src="src/Logo VOLTA 4k (2).png" alt="Logo VOLTA" style="width: 300px;">
            <h2>Como deseja logar?</h2>
            <button id="btn_empresa">Empresa</button>
            <br>
            <button id="btn_cooperativa">Cooperativa</button>
        </div>
    </div>
</body>
</html>
