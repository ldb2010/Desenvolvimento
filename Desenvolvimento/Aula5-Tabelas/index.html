<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
</head>
<h1>Aula 5 - Tabelas</h1>
<body>
    <table border="1">
        <theader>
            <tr>
                <th></th>
                <th>Coluna 1</th>
                <th>Coluna 1.5</th>
                <th>Coluna 2</th>
                <th>Coluna 3</th>

            </tr>
        </theader>
        <tbody>
            <tr>
                <th>Linha 1</th>
                <td colspan="2">1</td>
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <th>Linha 2</th>
                <td>10</td>
                <td colspan="2">20</td>
                <td>30</td>
            </tr>
            <tr>
                <th>Linha 3</th>
                <td>100</td>
                <td>200</td>
                <td colspan="2">300</td>
            </tr>
        </tbody>

    </table>
</body>
</html>
